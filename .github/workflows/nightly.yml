name: Deploy Nightly Packages to PyPI
jobs:
  centriole-wheels:
    uses: ./.github/workflows/publish-centriole.yml
    with:
      nightly: true
  deploy-nightly:
    needs: centriole-wheels
    runs-on: ubuntu-24.04
    env:
      TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
      TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # need to get git tags for setuptools-scm
        fetch-depth: 0
    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.80.0
        environments: ci-tools
        locked: true
        cache: true
        cache-key: pixi-ci-tools-
    - name: Prepare nightly config
      run: |
        pixi run --locked -e ci-tools python scripts/nightly_build.py
    - name: Download Centriole wheels
      uses: actions/download-artifact@v4
      with:
        name: centriole-nightly-wheels
        path: src/subpackages/centriole/dist
    - name: Upload Centriole
      working-directory: ${{ github.workspace }}/src/subpackages/centriole/
      run: |
        pixi run --locked -e ci-tools python -m build --no-isolation --sdist
        pixi run --locked -e ci-tools twine upload dist/*
    - name: Upload Library
      working-directory: ${{ github.workspace }}/src/subpackages/library/
      run: |
        pixi run --locked -e ci-tools python -m build --no-isolation
        pixi run --locked -e ci-tools twine upload dist/*
    - name: Upload Core
      working-directory: ${{ github.workspace }}/src/subpackages/core/
      run: |
        pixi run --locked -e ci-tools python -m build --no-isolation
        pixi run --locked -e ci-tools twine upload dist/*
    - name: Upload Frontend
      working-directory: ${{ github.workspace }}/src/frontend/
      run: |
        pixi run --locked -e ci-tools python -m build --no-isolation
        pixi run --locked -e ci-tools twine upload dist/*
on:
  push:
    branches:
      - main
  workflow_dispatch:
