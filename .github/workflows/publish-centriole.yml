name: Build Centriole wheels

on:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      nightly:
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-14, macos-15-intel]
        python_version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - os: ubuntu-latest
            platform_id: manylinux_x86_64
            manylinux_image: manylinux2014
          - os: windows-2022
            platform_id: win_amd64
          - os: macos-14
            platform_id: macosx_arm64
          - os: macos-15-intel
            platform_id: macosx_x86_64
          - python_version: '3.9'
            python: 39
            cibuildwheel: 'cibuildwheel<3'
          - python_version: '3.10'
            python: 310
            cibuildwheel: 'cibuildwheel<3'
          - python_version: '3.11'
            python: 311
            cibuildwheel: 'cibuildwheel<4'
          - python_version: '3.12'
            python: 312
            cibuildwheel: 'cibuildwheel<4'
          - python_version: '3.13'
            python: 313
            cibuildwheel: 'cibuildwheel<4'
          - os: ubuntu-latest
            python_version: '3.12'
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python_version: '3.13'
            manylinux_image: manylinux_2_28
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install build tools
        run: python -m pip install "${{ matrix.cibuildwheel }}" toml "setuptools-scm>=8.0"
      - name: Prepare nightly config
        if: inputs.nightly
        run: python scripts/nightly_build.py
      - name: Determine package version
        id: version
        shell: bash
        run: echo "version=$(python -m setuptools_scm -c src/subpackages/centriole/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - name: Build and check wheels
        run: python -m cibuildwheel src/subpackages/centriole --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          CIBW_ARCHS: auto
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_TEST_COMMAND: python -c "import centriole._cpmorphology2, centriole._convex_hull, centriole._filter, centriole._lapjv, centriole._propagate, centriole._fastemd"
      - uses: actions/upload-artifact@v4
        with:
          name: centriole-${{ inputs.nightly && 'nightly' || 'release' }}-${{ matrix.platform_id }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: centriole-${{ inputs.nightly && 'nightly' || 'release' }}-*-cp*
          merge-multiple: true
          path: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: centriole-${{ inputs.nightly && 'nightly' || 'release' }}-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
