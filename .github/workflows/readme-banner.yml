name: Update README banner

on:
  schedule:
    # Check daily so a missed run does not leave the previous month's banner.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-banner
  cancel-in-progress: false

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Create Banner Bot token
        uses: actions/create-github-app-token@v2
        id: banner-token
        with:
          app-id: ${{ vars.BANNER_APP_ID }}
          private-key: ${{ secrets.BANNER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.banner-token.outputs.token }}

      - name: Select banner for the current month
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          images = Path("src/frontend/cellprofiler/data/images")
          seasonal_black_text = {
              10: "splash_black_spellprofiler.webp",
              12: "splash_black_jinglecellprofiler.webp",
          }
          seasonal_white_text = {
              10: "splash_white_spellprofiler.webp",
              12: "splash_white_jinglecellprofiler.webp",
          }
          month = datetime.now(timezone.utc).month
          dark = images / (seasonal_white_text.get(month) or "splash-white-text-alpha.png")
          light = images / (seasonal_black_text.get(month) or "splash-black-text-alpha.png")
          for image in (dark, light):
              if not image.is_file():
                  raise SystemExit(f"Missing banner image: {image}")

          picture = (
              '<picture>\n'
              f'    <source media="(prefers-color-scheme: dark)" srcset="{dark}">\n'
              f'    <img alt="CellProfiler" src="{light}">\n'
              '</picture>'
          )
          readme = Path("README.md")
          original = readme.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"\A<picture>.*?</picture>", picture, original, count=1, flags=re.DOTALL
          )
          if count != 1:
              raise SystemExit("Could not find the README banner picture")
          if updated != original:
              readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit banner change
        env:
          GH_TOKEN: ${{ steps.banner-token.outputs.token }}
          BANNER_APP_SLUG: ${{ steps.banner-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README banner is already up to date."
            exit 0
          fi
          bot_name="${BANNER_APP_SLUG}[bot]"
          bot_id=$(gh api "users/${bot_name}" --jq .id)
          git config user.name "$bot_name"
          git config user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update seasonal README banner"
          git push
