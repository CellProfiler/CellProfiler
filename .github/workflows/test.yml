name: Run tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.suite }} (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        suite: [frontend, core, library, centriole]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.80.0
          environments: dev
          locked: true
          cache: true
          cache-key: pixi-dev-
      - name: Stop runner MySQL
        if: runner.os == 'Linux' && matrix.suite == 'frontend'
        run: sudo systemctl stop mysql
      - name: Run tests - Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pixi run --locked -e dev python .github/run_tests.py ${{ matrix.suite }}
      - name: Run tests - Windows and macOS
        if: runner.os != 'Linux'
        run: pixi run --locked -e dev python .github/run_tests.py ${{ matrix.suite }}
