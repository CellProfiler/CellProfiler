name: Run tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths-ignore: [README.md]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the tests on macOS"
        type: boolean
        default: false
      windows:
        description: "Also run the tests on Windows"
        type: boolean
        default: false
      suites:
        description: "Comma-separated suites to run, or 'all'"
        type: string
        default: all

jobs:
  matrix:
    name: Build test matrix
    # linux always runs, macos/windows are opt-in via workflow_dispatch inputs
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.build.outputs.os }}
      suite: ${{ steps.build.outputs.suite }}
    steps:
      - name: Build matrix
        id: build
        env:
          # empty (falsy) for every trigger other than workflow_dispatch
          MACOS: ${{ inputs.macos }}
          WINDOWS: ${{ inputs.windows }}
          SUITES: ${{ inputs.suites }}
        run: |
          os=(ubuntu-latest)
          if [ "$MACOS" = "true" ]; then os+=(macos-latest); fi
          if [ "$WINDOWS" = "true" ]; then os+=(windows-latest); fi

          suites=$SUITES
          if [ -z "$suites" ] || [ "$suites" = "all" ]; then
            suites="frontend,core,library,centriole"
          fi

          {
            echo "os=$(jq -cn '$ARGS.positional' --args "${os[@]}")"
            echo "suite=$(printf '%s' "$suites" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          } >> "$GITHUB_OUTPUT"
      - name: Show matrix
        run: echo '${{ steps.build.outputs.os }} x ${{ steps.build.outputs.suite }}'

  test:
    name: Test ${{ matrix.suite }} (${{ matrix.os }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        suite: ${{ fromJSON(needs.matrix.outputs.suite) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.80.0
          environments: dev
          locked: true
          cache: true
          cache-key: pixi-dev-
          cache-write: ${{ matrix.suite == fromJSON(needs.matrix.outputs.suite)[0] }}
      - name: Stop runner MySQL
        # we run our own pixi-supplied mysql, stop the default one on linux
        if: runner.os == 'Linux' && matrix.suite == 'frontend'
        run: sudo systemctl stop mysql
      - name: Run tests - Linux
        if: runner.os == 'Linux'
        # run in headless X server (X virtual framebuffer) for GUI tests
        run: xvfb-run -a pixi run --locked -e dev python .github/run_tests.py ${{ matrix.suite }}
      - name: Run tests - Windows and macOS
        if: runner.os != 'Linux'
        run: pixi run --locked -e dev python .github/run_tests.py ${{ matrix.suite }}
