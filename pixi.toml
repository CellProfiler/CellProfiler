[workspace]
name = "CellProfiler"
description = """
CellProfiler is a free open-source software designed \
to enable biologists without training in computer vision \
or programming to quantitatively measure phenotypes from \
thousands of images automatically."""
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
cp = { cmd = ["python", "-m", "cellprofiler"] }

[feature.mysql.tasks]
# configure the database - should be run only once, on enviroment creation
cfg-db = "$PIXI_PROJECT_ROOT/scripts/mysql_test.sh config"
# run just the exporttodatabase tests
dbtest = "$PIXI_PROJECT_ROOT/scripts/mysql_test.sh run"
# run all tests, pass in args if you want them to pass through
tests = "$PIXI_PROJECT_ROOT/scripts/mysql_test.sh run-all"

[target.osx.tasks]
cp = { cmd = ["python", "-m", "cellprofiler", "-L", "10"] }
cpd = { cmd = ["python", "-Wd", "-m", "cellprofiler", "-L", "10"] }

[feature.mysql.activation]
# https://github.com/PyMySQL/mysqlclient/issues/496#issuecomment-1614688099
env = { MYSQLCLIENT_CFLAGS = "-I$CONDA_PREFIX/include/mysql", MYSQLCLIENT_LDFLAGS = "-L$CONDA_PREFIX/lib -lmysqlclient -rpath $CONDA_PREFIX/lib", PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig" }

[feature.mysql.target.linux-64.activation]
env = { MYSQLCLIENT_CFLAGS = "-I$CONDA_PREFIX/include/mysql", MYSQLCLIENT_LDFLAGS = "-L$CONDA_PREFIX/lib" }

[feature.java.activation]
env = { JAVA_HOME = "$CONDA_PREFIX/lib/jvm" }

[dependencies]
python = "3.14.*"
h5py = ">=3.11"
numpy = ">=2"
numcodecs = ">=0.16.6"

[pypi-dependencies]
appose = { git = "https://github.com/apposed/appose-python.git", rev = "f3b28336e9ca96e794e654f2ca916a59919b64c6" }

[target.linux-64.dependencies]
# Review whether SDL2 is needed during Linux runtime validation.
sdl2 = ">=2.0.0"
wxpython = ">=4.2.5,<=4.3.2"

[target.linux-64.activation]
# Review whether LD_LIBRARY_PATH is needed during Linux runtime validation.
env = { LD_LIBRARY_PATH = "$LD_LIBRARY_PATH:$CONDA_PREFIX/lib" }

[feature.mysql.dependencies]
mysql = "*"

[feature.mysql.target.osx.dependencies]
pkg-config = "*"
mysqlclient = ">=2.2.3"

[feature.mysql.target.win-64.dependencies]
pkg-config = "*"

[feature.mysql.target.linux-64.dependencies]
mysqlclient = ">=2.2.3"

[feature.java.dependencies]
openjdk = "11.*"
maven = ">=3.9.9"

[feature.mod.pypi-dependencies]
centriole = { path = "./src/subpackages/centriole", extras = ["test"], editable = true }
cellprofiler-library = { path = "./src/subpackages/library", extras = ["test"], editable = true }
cellprofiler-core = { path = "./src/subpackages/core", extras = ["test"], editable = true }
cellprofiler = { path = "./src/frontend", extras = ["test"], editable = true }

[feature.build.pypi-dependencies]
centriole = { path = "./src/subpackages/centriole", extras = ["build"], editable = true }
cellprofiler-library = { path = "./src/subpackages/library", extras = ["build"], editable = true }
cellprofiler-core = { path = "./src/subpackages/core", extras = ["build"], editable = true }
cellprofiler = { path = "./src/frontend", extras = ["build", "docs"], editable = true }
setuptools = "*"
setuptools-scm = "*"

[feature.publish.target.linux-64.dependencies]
# below two needed for installing cellprofiler source into final env inside flatpak
setuptools = "*"
setuptools-scm = "*"
# don't need all of mysql feature, but do need prebuild mysqlclient
mysqlclient = ">=2.2.3"

[feature.publish.target.osx.dependencies]
mysqlclient = ">=2.2.3"
mysql-client = "*"

[feature.publish.pypi-dependencies]
cython = "*"
centriole = { path = "./src/subpackages/centriole", editable = false }
cellprofiler-library = { path = "./src/subpackages/library", editable = false }
cellprofiler-core = { path = "./src/subpackages/core", editable = false }
cellprofiler = { path = "./src/frontend", editable = false }

[feature.profile.pypi-dependencies]
py-spy = "*"
memray = "*"

[environments]
dev = ["mod", "java", "mysql"]
build = ["build", "java", "mysql"]
prod = ["publish", "java"]
profile = ["mod", "java", "mysql", "profile"]
